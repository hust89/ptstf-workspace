name: Rust CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  PROTOC_NO_VENDOR: 1

jobs:
  style:
    name: Code Formatting & Quality Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

  test-and-lint:
    name: Compilation, Linting & Mathematical Monotonicity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri & Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            libssl-dev

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Integration
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Lint Audits (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Core Mathematical Engine Tests
        run: cargo test -p ptstf-core --all-features

      - name: Run Complete Workspace Test Suite (Core, gRPC, Desktop)
        run: cargo test --workspace --all-features
