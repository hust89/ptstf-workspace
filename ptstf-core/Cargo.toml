[package]
name = "ptstf-core"
version = "1.1.0"
edition = "2021"
authors = ["Gemini Enterprise"]
description = "Mathematical engine for the Partitioned Trigram-Spectral Tensor Flow (PTSTF) Instrument"
license = "Proprietary"
publish = false

[lib]
name = "ptstf_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3"]

[dependencies]
nalgebra = { version = "0.32", features = ["serde-serialize"] }
rayon = "1.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py37"], optional = true }
